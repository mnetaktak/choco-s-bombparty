<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choco’s BombParty</title>
<style>
:root{--bg:#faf5ee;--fg:#3b2416;--mu:#8a7767;--cd:#fff;--ln:#e7dccd;--ac:#6b3f26;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b130e;--fg:#f3e7da;--mu:#a8937f;--cd:#271b14;--ln:#3a2a20;--ac:#c58a5e;--on:#1b130e}}
:root[data-theme="dark"]{--bg:#1b130e;--fg:#f3e7da;--mu:#a8937f;--cd:#271b14;--ln:#3a2a20;--ac:#c58a5e;--on:#1b130e}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:clamp(30px,8vw,56px);text-align:center;margin:7vh 0 20px;background:linear-gradient(90deg,#f33,#f90,#fc0,#3c3,#09f,#63f,#f3c,#f33);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 5s linear infinite}
@keyframes rb{to{background-position:200% 0}}
.card{max-width:360px;margin:0 auto;display:grid;gap:10px}
input,button{font:inherit;color:inherit;border:1px solid var(--ln);background:var(--cd);border-radius:10px;padding:9px 12px;min-width:0}
button{cursor:pointer}button.on{outline:2px solid var(--ac)}
.p,#go,#again{background:var(--ac);border-color:var(--ac);color:var(--on)}
#avs,.row,.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row input{flex:1}.bar{justify-content:space-between;margin-bottom:10px}
#avs button{padding:4px 8px;font-size:20px}#avs .av{width:24px;height:24px;font-size:16px}
.mu,#er{color:var(--mu);text-align:center;margin:0}
.wrap{display:grid;grid-template-columns:1fr 270px;gap:14px}@media(max-width:700px){.wrap{grid-template-columns:1fr}}
#code{font-size:22px;letter-spacing:.2em}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;font-size:22px;background:var(--ln);font-style:normal;flex:none}
.pc{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);margin-bottom:6px}
#stg{position:relative;height:min(82vw,400px)}
.g{position:absolute;transform:translate(-50%,-50%);flex-direction:column;gap:2px;text-align:center;font-size:12px;margin:0;width:92px}
.cur{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac)}.dead{opacity:.35}.hp{color:#d33;letter-spacing:1px}
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:40%}
.syl{font-size:clamp(22px,6vw,34px);font-weight:800;letter-spacing:.1em}.ty{min-height:20px;color:var(--mu)}
#in{width:100%;margin-top:8px;font-size:20px;text-align:center}.sh{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#log{height:280px;overflow:auto;border:1px solid var(--ln);border-radius:10px;padding:8px;background:var(--cd);font-size:13px;margin-bottom:8px;overflow-wrap:anywhere}
#ci{width:100%}input[type=checkbox]{padding:0;width:auto;vertical-align:middle}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ac);color:var(--on);padding:8px 14px;border-radius:99px;z-index:20}
.splash{position:fixed;inset:0;pointer-events:none;z-index:15;animation:fo 3.4s forwards}
@keyframes fo{0%,65%{opacity:1}100%{opacity:0}}
.splash i{position:absolute;top:0;background:#4b2a16;border-radius:0 0 99px 99px;transform-origin:top;transform:scaleY(0);animation:st 2.2s ease-in forwards}
.splash .t{left:0;right:0;height:7vh;border-radius:0;animation:st 1s ease-out forwards}
@keyframes st{from{transform:scaleY(0);opacity:0}15%{opacity:1}to{transform:scaleY(1);opacity:1}}

#avs button{font-size:14px;padding:8px 12px}#pv .av{width:44px;height:44px;font-size:20px}
aside>b{display:block;margin-bottom:6px}</style></head><body><main><div class="wrap"><div>
<section id="home">
<h1>Choco’s BombParty</h1>
<div class="card">
<input id="nm" maxlength="14" placeholder="Your name">
<div id="avs"><span id="pv"></span><button id="up">Upload picture</button><button id="rma">Remove</button></div>
<input type="file" id="fl" accept="image/*" hidden>
<label class="mu"><input type="checkbox" id="pub" checked> List in public lobbies</label>
<button class="p" id="mk">Create lobby</button>
<div class="row"><input id="cd" maxlength="6" placeholder="Lobby code"><button id="jn">Join</button></div>
<p id="er"></p>
<h3 class="mu" style="margin:14px 0 0">Public lobbies</h3><div id="lobs"><p class="mu">Connecting…</p></div>
</div></section>
<section id="rm" hidden>
<div class="bar"><span id="code"></span><button id="lv">Leave</button></div>
<div id="lob"></div>
<div id="gm" hidden><div id="stg"></div><input id="in" autocomplete="off" autocapitalize="off" placeholder="Type a word" hidden></div>
</section></div>
<aside><b class="mu">Global chat</b><div id="log"></div><input id="ci" maxlength="140" placeholder="Say something"></aside></div>
<div id="toast" hidden></div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BOMB='<svg id="bomb" viewBox="0 -8 100 128" width="76"><path d="M28 32L50 10l22 22z" fill="#5a3320"/><rect x="28" y="32" width="44" height="80" rx="5" fill="#7b4a2e"/><rect x="28" y="58" width="44" height="26" fill="#f4e6d3"/><text x="50" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#5a3320">CHOCO</text><path d="M50 10q6-12 18-8" fill="none" stroke="#999" stroke-width="3"/><circle cx="68" cy="2" r="5" fill="#fb0"/></svg>';
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
function splash(){let h='<i class="t"></i>';for(let i=0;i<16;i++)h+='<i style="left:'+(Math.random()*96)+'%;width:'+(3+Math.random()*7)+'%;height:'+(25+Math.random()*60)+'%;animation-delay:'+(Math.random()*.6).toFixed(2)+'s"></i>';const s=document.createElement('div');s.className='splash';s.innerHTML=h;document.body.appendChild(s);setTimeout(()=>s.remove(),3500)}
function line(n,t){const l=$('log');l.insertAdjacentHTML('beforeend','<div><b>'+n+':</b> '+t+'</div>');l.scrollTop=l.scrollHeight}
let me0={n:'',a:''};try{Object.assign(me0,JSON.parse(localStorage.getItem('cbp')||'{}'))}catch(e){}
if(!/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(me0.a||''))me0.a='';
$('nm').value=me0.n||'';
let ws,me=0,host=0,mem=[],S=null,lastEx=null,lastFb=0,inRoom=false;
const P=id=>mem.find(x=>x.id===id)||{id:id,n:'Player',a:''};
const av=p=>/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(p.a||'')?'<img class="av" src="'+p.a+'">':'<i class="av" style="background:hsl('+((+p.id||5)*47%360)+' 45% 40%);color:#fff">'+esc(String(p.n||'?')[0].toUpperCase())+'</i>';
const pv=()=>{$('pv').innerHTML=av({id:me||5,n:$('nm').value||'?',a:me0.a});$('rma').hidden=!me0.a};
pv();$('nm').addEventListener('input',pv);
const tx=o=>{if(ws&&ws.readyState===1){ws.send(JSON.stringify(o));return true}return false};
function back(){inRoom=false;S=null;$('rm').hidden=true;$('home').hidden=false}
function conn(){
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{$('er').textContent='';tx({t:'hello',n:me0.n||'Player',a:me0.a})};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}h(m)};
 ws.onclose=()=>{back();$('lobs').innerHTML='<p class="mu">Connecting…</p>';$('er').textContent='Disconnected. Reconnecting…';setTimeout(conn,2000)};
}
function h(m){switch(m.t){
 case 'hi':me=m.id;$('log').innerHTML='';pv();break;
 case 'chat':line(esc(m.n),esc(m.m));break;
 case 'lobbies':browse(m.l);break;
 case 'joined':inRoom=true;S=null;lastEx=null;mem=[];$('home').hidden=true;$('rm').hidden=false;$('code').textContent=String(m.c).toUpperCase();$('lob').innerHTML='';$('gm').hidden=true;$('er').textContent='';break;
 case 'mem':mem=m.m;host=m.host;render();break;
 case 'st':S=m;S.end=Date.now()+m.rem;S.ty='';render();break;
 case 'ty':{const e=document.querySelector('.ty');if(e)e.innerHTML=esc(String(m.v).slice(0,30))+'&nbsp;';break}
 case 'err':$('er').textContent=m.m;break;
}}
function browse(L){$('lobs').innerHTML=L.length?L.map(l=>'<div class="pc"><b>'+esc(String(l.h).slice(0,14))+'’s lobby</b><small class="mu">'+(+l.n)+' player'+(l.n==1?'':'s')+(l.p?' · in game':'')+'</small><button data-c="'+esc(l.c)+'" style="margin-left:auto">Join</button></div>').join(''):'<p class="mu">No public lobbies yet. Create one!</p>'}
function render(){
 if(!inRoom||!S)return;const g=S.ph!=='l';$('lob').hidden=g;$('gm').hidden=!g;
 if(g){stage();fx();turn()}else lobby();
}
function lobby(){
 $('lob').innerHTML=mem.map(p=>'<div class="pc">'+av(p)+'<b>'+esc(p.n)+(p.id===me?' (you)':'')+'</b>'+(p.id===host?'<small class="mu">host</small>':'')+'</div>').join('')+(host===me?'<button class="p" id="go">Start game</button><p class="mu">You can start alone to practise.</p>':'<p class="mu">Waiting for the host to start…</p>');
}
function stage(){
 const n=S.pl.length;let h='';
 S.pl.forEach((p,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,q=P(p.id);
  h+='<div class="pc g'+(i===S.cur&&S.ph==='p'?' cur':'')+(p.l<1?' dead':'')+'" style="left:'+(n>1?50+34*Math.cos(a):50)+'%;top:'+(n>1?50+38*Math.sin(a):8)+'%">'+av(q)+'<b>'+esc(q.n)+(p.id===me?' (you)':'')+'</b><span class="hp">'+('♥'.repeat(Math.max(p.l,0))||'☠')+'</span></div>'});
 h+='<div class="mid">'+(S.ph==='p'?BOMB+'<div class="syl">'+esc(S.syl.toUpperCase())+'</div><div class="ty">&nbsp;</div><div class="mu">'+(S.lw?'Last: '+esc(S.lw)+' · ':'')+S.sc+' word'+(S.sc==1?'':'s')+'</div>':'<div class="syl">'+(n>1?'🏆 '+esc(P(S.win).n)+' wins':'Game over')+'</div><p class="mu">'+S.sc+' word'+(S.sc==1?'':'s')+' played</p>'+(host===me?'<button class="p" id="again">Back to lobby</button>':''))+'</div>';
 $('stg').innerHTML=h;
}
function fx(){
 if(lastEx===null){lastEx=S.ex?S.ex.n:0;lastFb=S.fb?S.fb.n:0;return}
 if(S.ex&&S.ex.n!==lastEx){lastEx=S.ex.n;splash();toast('💥 '+P(S.ex.id).n+' lost a life')}
 if(S.fb&&S.fb.n!==lastFb){lastFb=S.fb.n;if(S.fb.p===me){const i=$('in');i.classList.remove('sh');void i.offsetWidth;i.classList.add('sh');i.select()}}
}
function turn(){
 const mine=S.ph==='p'&&S.pl[S.cur]&&S.pl[S.cur].id===me,i=$('in'),k=S.sc+'|'+(S.ex?S.ex.n:0);
 i.hidden=!mine;
 if(mine&&i.dataset.k!==k){i.value='';i.focus()}
 if(!mine)i.value='';
 i.dataset.k=mine?k:'';
}
$('in').addEventListener('input',e=>{const v=e.target.value.replace(/[^a-zA-Z]/g,'');e.target.value=v;tx({t:'type',v:v.slice(0,30)})});
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value)tx({t:'word',w:e.target.value})});
$('ci').addEventListener('keydown',e=>{const v=e.target.value.trim();if(e.key==='Enter'&&v){prof();tx({t:'chat',m:v});e.target.value=''}});
function prof(){me0.n=$('nm').value.trim().slice(0,14)||'Player'+(10+Math.random()*90|0);$('nm').value=me0.n;try{localStorage.setItem('cbp',JSON.stringify(me0))}catch(e){}tx({t:'hello',n:me0.n,a:me0.a})}
function join(c){prof();if(!tx({t:'join',c:c}))$('er').textContent='Not connected yet.'}
$('mk').onclick=()=>{prof();if(!tx({t:'create',pub:$('pub').checked}))$('er').textContent='Not connected yet.'};
$('jn').onclick=()=>{const c=$('cd').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');if(c)join(c)};
$('lv').onclick=()=>{tx({t:'leave'});back()};
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.c)join(t.dataset.c);else if(t.id==='up')$('fl').click();else if(t.id==='rma'){me0.a='';pv()}else if(t.id==='go')tx({t:'start'});else if(t.id==='again')tx({t:'again'})});
$('fl').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=40;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,40,40);let q=.6,d;do{d=c.toDataURL('image/jpeg',q);q-=.15}while(d.length>3900&&q>.1);me0.a=d;pv()};im.src=r.result};r.readAsDataURL(f)});
(function loop(t){const b=document.getElementById('bomb');if(b&&S&&S.ph==='p'){const r=S.end-Date.now(),k=r<3500;b.style.transform='rotate('+Math.sin(t/(k?22:110))*(k?7:1.5)+'deg)'}requestAnimationFrame(loop)})(0);
conn();
</script></body></html>
